# server.properties base para el servidor modded (Forge).
# Ajusta a gusto; estos son valores razonables de partida.

server-port=25565
motd=Servidor de Minecraft modded (Forge)
max-players=10
difficulty=normal
gamemode=survival
hardcore=false
pvp=true
online-mode=true
white-list=false
enforce-whitelist=false
spawn-protection=0
view-distance=8
simulation-distance=6
allow-flight=true
level-name=world
level-seed=
level-type=minecraft\:normal

# RCON (opcional, usado por scripts/rcon.py si despliegas en Azure con terraform)
enable-rcon=false
rcon.port=25575
rcon.password=

enable-query=false
enable-command-block=false
broadcast-rcon-to-ops=false
